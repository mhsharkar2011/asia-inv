services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: asia-enterprise
    container_name: asia-enterprise
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - asia_enterprise
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PHP_IDE_CONFIG=serverName=Docker

  nginx:
    image: nginx:1.27-alpine
    container_name: asia-enterprise-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asia_enterprise
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: asia-enterprise-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: db_asia_inv
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: asia_inv          # ✅ dedicated app user (NOT root)
      MYSQL_PASSWORD: password       # ✅ different from root password
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - asia_enterprise
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: asia-enterprise-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    networks:
      - asia_enterprise
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: asia-enterprise
    container_name: asia-enterprise-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
    networks:
      - asia_enterprise
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: asia-enterprise
    container_name: asia-enterprise-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./:/var/www
    networks:
      - asia_enterprise
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  asia_enterprise:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
